# Production Redis is only reachable from the API over private_store.
# All credentials and TLS files are mounted at deploy time, never committed.
port 0
tls-port 6379
tls-cert-file /run/secrets/redis-cert.pem
tls-key-file /run/secrets/redis-key.pem
tls-ca-cert-file /run/secrets/redis-ca.pem
tls-auth-clients no
aclfile /run/secrets/redis-users.acl
protected-mode yes
appendonly yes
save 60 1000
maxmemory-policy noeviction
dir /data
