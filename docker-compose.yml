name: soorin-privacy
services:
  privacy-api:
    build: .
    env_file: .env
    environment:
      DLP_STORE_BACKEND: redis
      DLP_REDIS_URL: redis://redis:6379/0
      DLP_PROFILE_DIR: /opt/dlp/profiles
      # Per-request cap (~64 MiB). ≤48 MiB console uploads use one shot; larger jobs chunk.
      DLP_MAX_PAYLOAD_BYTES: "67108864"
      DLP_MAX_ENTRIES: "1000000"
    ports:
      # Bind all interfaces so LAN VMs (e.g. http://192.168.x.x:8484) can reach the API/UI.
      # For internet-facing hosts prefer 127.0.0.1 + reverse proxy/TLS instead.
      - "8484:8484"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=256m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 4g
    cpus: 2.0
    networks: [edge, private]
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1000", "--maxmemory", "2gb", "--maxmemory-policy", "noeviction"]
    volumes: ["dlp-redis:/data"]
    expose: ["6379"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [private]
networks:
  edge:
  private:
    internal: true
volumes:
  dlp-redis:
