[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "soorin-privacy-sdk"
version = "0.1.0"
requires-python = ">=3.11"
description = "Typed Python client for Soorin Data Privacy Gateway"
dependencies = ["httpx>=0.27,<1"]

[tool.setuptools.packages.find]
where = ["."]
include = ["soorin_privacy*"]
